spring.application.name=safeme-backend
server.port=${SERVER_PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/safeme}
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

safeme.jwt.secret=${JWT_SECRET:}
safeme.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

safeme.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
safeme.auth.otp-required=${SAFEME_OTP_REQUIRED:false}
safeme.uploads.dir=${SAFEME_UPLOADS_DIR:./uploads}
safeme.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

safeme.bootstrap.email=${SAFEME_BOOTSTRAP_EMAIL:}
safeme.bootstrap.password=${SAFEME_BOOTSTRAP_PASSWORD:}
safeme.bootstrap.full-name=${SAFEME_BOOTSTRAP_NAME:SafeMe User}
safeme.bootstrap.mobile=${SAFEME_BOOTSTRAP_MOBILE:}
